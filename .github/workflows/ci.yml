name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    # No secrets: this job never sees GROQ_API_KEY or any real credential.
    # Neo4j below uses a fixed, dev-only, non-secret password for the
    # disposable service container only.
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/localtestpass123
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format check)
        run: uv run ruff format --check src tests

      - name: Mypy (strict)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: localtestpass123
        run: uv run pytest tests/integration -q

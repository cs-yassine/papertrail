[project]
name = "papertrail"
version = "0.1.0"
description = "Contradiction-aware GraphRAG research agent over arXiv papers."
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # Phase 0 needs only what its own tests exercise: config, the checkpointer
    # API, and the Neo4j driver. Everything else (langchain, langgraph nodes,
    # fastapi, sentence-transformers, ...) is added in the phase that first
    # needs it — see CLAUDE.md rule 2, one phase per session.
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "neo4j>=5.25,<6",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "aiosqlite>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "detect-secrets>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
